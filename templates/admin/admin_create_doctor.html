{% extends "base.html" %}

{% block content %}
<div class="container mt-4" style="max-width: 500px;">
    <h3 class="text-center mb-4">Add a New Doctor</h3>

    <div class="p-3 border rounded">
        <form action="{{ url_for('admin_create_doctor') }}" method="POST">

            <div class="mb-3">
                <label class="form-label">Fullname</label>
                <input type="text" name="fullname" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Department</label>
                <select name="department" class="form-control" required>
                    <option value="">-- Select Department --</option>
                    {% for dept in departments %}
                    <option value="{{ dept.id }}">{{ dept.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Experience (years)</label>
                <input type="number" name="experience" class="form-control" min="0">
            </div>

            <div class="mb-3">
                <label class="form-label">Doctor Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password (optional)</label>
                <input type="password" name="password" class="form-control">
            </div>

            <button class="btn btn-primary w-100">Add Doctor</button>
        </form>
    </div>
</div>
{% endblock %}
